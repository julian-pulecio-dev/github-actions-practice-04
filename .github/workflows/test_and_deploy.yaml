name: test and deploy
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node
      - name: lint
        uses: npm lint    
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node
      - name: tests
        uses: npm test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node
      - name: deploy
        run: echo "deploying"
  