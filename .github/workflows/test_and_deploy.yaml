name: test and deploy
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
      - name: install
        run: npm install
      - name: lint
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
      - name: install
        run: npm install
      - name: tests
        run: npm run test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
      - name: deploy
        run: echo "deploying"
  