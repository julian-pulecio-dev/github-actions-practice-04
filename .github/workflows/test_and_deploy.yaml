name: test and deploy
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
      - name: lint
        run: npm lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
      - name: tests
        run: npm test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
      - name: deploy
        run: echo "deploying"
  